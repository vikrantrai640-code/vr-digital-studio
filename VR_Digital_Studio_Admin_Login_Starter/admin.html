<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | VR Digital Studio</title>
<link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css">
<style>
.admin-wrap{min-height:100vh;background:#0b1422;display:grid;place-items:center;padding:24px}.admin-card{width:min(100%,440px);padding:36px;background:#fff;border-radius:16px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.admin-mark{font:800 20px var(--font-heading);letter-spacing:-.04em;color:#101c2e}.admin-mark span{color:var(--blue)}.admin-card .eyebrow{margin:28px 0 10px;color:var(--blue)}.admin-card h1{font:800 32px var(--font-heading);letter-spacing:-.06em;margin:0 0 8px;color:#101c2e}.admin-sub{font-size:12px;color:#667085;line-height:1.7;margin-bottom:25px}.admin-card label{display:block;font-size:11px;font-weight:700;color:#344054;margin:14px 0 7px}.admin-card input{width:100%;padding:12px;border:1px solid #dce2ea;border-radius:6px;font:inherit;font-size:13px}.admin-card button{width:100%;margin-top:22px;border:0;border-radius:6px;padding:13px;background:#2563eb;color:white;font-weight:800;cursor:pointer}.admin-msg{min-height:22px;font-size:11px;color:#b42318;margin-top:12px}.admin-back{display:inline-block;margin-top:16px;font-size:11px;color:#667085;text-decoration:none}.admin-warning{font-size:10px;line-height:1.6;color:#667085;margin-top:22px;border-top:1px solid #eef0f3;padding-top:15px}
</style>
</head><body>
<div class="admin-wrap"><main class="admin-card"><a class="admin-mark" href="index.html">VR<span>.</span> DIGITAL STUDIO</a>
<p class="eyebrow">SECURE AREA</p><h1>Admin Login</h1><p class="admin-sub">Sign in with the studio administrator account.</p>
<form id="login-form"><label for="email">ADMIN EMAIL</label><input id="email" type="email" autocomplete="username" required value="vikrantrai640@gmail.com"><label for="password">PASSWORD</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">SIGN IN</button><p id="message" class="admin-msg" role="status"></p></form>
<a class="admin-back" href="index.html">← Back to website</a><p class="admin-warning">Admin access is restricted to the studio email. Keep your password private and do not share it.</p></main></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="admin.js"></script>
</body></html>
